# Fork-only Android build.
#
# Upstream's release.yml / nightly.yml also build Android, but their signing
# steps require repository secrets a fork does not have (ANDROID_KEY_BASE64,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, TAURI_SIGNING_PRIVATE_KEY, plus the
# R2 credentials for the upload leg), so running them here fails at the very end
# of a ~50-minute build. This workflow is the fork's replacement: it produces a
# **debug-signed**, directly installable APK and needs no secrets at all.
#
# It is a new file, so an upstream merge never conflicts with it. Debug builds
# are signed with the debug keystore that `tauri android init` generates, which
# Android accepts for sideloading; Play Store uploads would need a real keystore.
name: Fork Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (empty = the branch this workflow ran from)'
        required: false
        default: ''
      abi:
        description: 'Package every ABI in one APK, or arm64 only (smaller, covers modern phones)'
        type: choice
        options:
          - universal
          - arm64
        default: universal

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    # The first cold run is ~50 min (two Rust/NDK link passes upstream measured
    # at that); rust-cache makes later runs much shorter.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          # The legacy `tools` package (part of the action's default) no longer
          # exists in the SDK repository and makes sdkmanager fail.
          packages: 'platform-tools'

      - name: install NDK
        # Pinned to the version upstream builds against; the Rust/NDK ABI
        # expectations are not portable across NDK majors.
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: fork-android-${{ inputs.abi }}-cargo

      # NO .env.local: the committed .env already carries the base64 defaults
      # (Supabase URL/anon key, PostHog, Stripe publishable key) and
      # NEXT_PUBLIC_APP_PLATFORM comes from .env.tauri via the `build` script's
      # `dotenv -e .env.tauri`. Nothing here needs a repository secret.

      - name: init the Android project
        working-directory: apps/readest-app
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          # Branding only; the generated default icon is used if this is
          # unavailable. Cosmetic, so it must not fail the build.
          [ -f ../../data/icons/readest-book.png ] && pnpm tauri icon ../../data/icons/readest-book.png || true

      - name: build the debug APK
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          # `--debug` is what makes the APK installable without a release
          # keystore: Gradle signs it with the generated debug key.
          if [ "${{ inputs.abi }}" = "arm64" ]; then
            pnpm tauri android build --debug -t aarch64
          else
            pnpm tauri android build --debug
          fi

      - name: stage the APK
        working-directory: apps/readest-app
        run: |
          set -euo pipefail
          # `-print -quit` rather than `| head -n 1`: under `pipefail` an early
          # `head` exit hands `find` a SIGPIPE and fails the step.
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          cp "$apk" "Readest-fork-${version}-${{ inputs.abi }}-debug.apk"
          echo "staged $apk -> Readest-fork-${version}-${{ inputs.abi }}-debug.apk"
          ls -lh Readest-fork-*.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-fork-android-${{ inputs.abi }}
          path: apps/readest-app/Readest-fork-*-debug.apk
          if-no-files-found: error
          retention-days: 30
